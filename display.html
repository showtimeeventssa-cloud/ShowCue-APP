<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShowCue TV Display</title><style>html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;overflow:hidden}body{display:grid;place-items:center}.wrap{width:100%;height:100%;display:grid;place-items:center}.video{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;display:none}.text{text-align:center;padding:5vw}.title{font-size:clamp(36px,7vw,96px);font-weight:800}.sub{font-size:clamp(18px,3vw,42px);margin-top:16px;color:#d5dce2}.badge{position:fixed;top:14px;left:14px;color:#8d9aa5;font-size:12px;opacity:.65}.back{position:fixed;z-index:99999;display:none;text-decoration:none;text-align:center;box-sizing:border-box;background:rgba(35,35,35,.96);color:#fff;border:1px solid rgba(255,255,255,.25);font-weight:800;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}.back:hover{background:rgba(28,38,48,.95)}
@media (pointer:coarse){.back{display:block;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:14px 34px;border-radius:999px;font-size:18px;min-width:120px;box-shadow:0 4px 18px rgba(0,0,0,.55)}}
</style></head><body><div class="badge">SHOWCUE TV DISPLAY</div><a id="back" class="back" href="./index.html" aria-label="Back to ShowCue TV Display">Back</a><div class="wrap"><video id="v" class="video" playsinline muted autoplay></video><div class="text" id="text"><div class="title">ShowCue</div><div class="sub">Ready for performance</div></div></div><script>
const DB='ShowCueMediaDB',STORE='files';
let db=null,url=null;
let displayChannel=null;
try{displayChannel=new BroadcastChannel('showcue-tv-display-v36')}catch(e){displayChannel=null}
const v=document.getElementById('v'),text=document.getElementById('text'),back=document.getElementById('back');
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function getFile(k){if(!k)return null;if(!db)db=await openDB();return new Promise((res,rej)=>{const q=db.transaction(STORE).objectStore(STORE).get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})}
const isMobileDevice=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||((navigator.maxTouchPoints||0)>1&&/Macintosh/i.test(navigator.userAgent)&&Math.min(screen.width,screen.height)<=1366);
if(isMobileDevice)back.style.display='block';
function goBack(){if(window.opener&&!window.opener.closed){try{window.opener.focus()}catch(e){}try{window.close()}catch(e){}}if(history.length>1){history.back();return false}if(document.referrer){location.replace(document.referrer);return false}location.href='./index.html';return false}
back.addEventListener('click',e=>{e.preventDefault();goBack()});
function setMessage(title,sub){text.style.display='block';v.style.display='none';text.innerHTML='<div class="title">'+(title||'ShowCue')+'</div><div class="sub">'+(sub||'Ready for performance')+'</div>'}
async function showVideo(d){
  const info=d.video||{};
  if(!info.fileKey){setMessage(d.song?.name||d.pad?.name||'ShowCue','Ready for performance');return}
  try{
    const f=info.blob instanceof Blob ? info.blob : await getFile(info.fileKey);
    if(!f){setMessage(info.name||d.song?.name||d.pad?.name||'ShowCue','Video file unavailable on this device');return}
    if(url)URL.revokeObjectURL(url);
    url=URL.createObjectURL(f);
    v.pause();v.removeAttribute('src');v.load();v.src=url;v.muted=true;v.autoplay=true;v.playsInline=true;v.style.display='block';text.style.display='none';
    const target=Number(d.time)||0;
    const playNow=()=>{
      try{if(Number.isFinite(target)&&target>=0&&v.duration&&target<v.duration)v.currentTime=target}catch(e){}
      if(d.playing===true||d.action==='play')v.play().catch(()=>{});
    };
    if(v.readyState>=1)playNow();else v.addEventListener('loadedmetadata',playNow,{once:true});
  }catch(err){console.error(err);setMessage(info.name||d.song?.name||d.pad?.name||'ShowCue','Unable to load video')}
}
async function handle(d){
  if(!d||d.source!=='showcue')return;
  if(d.video&&(d.video.fileKey||d.video.blobUrl)){if(d.video.blobUrl){try{if(url)URL.revokeObjectURL(url);url=d.video.blobUrl;v.pause();v.src=url;v.muted=true;v.autoplay=true;v.playsInline=true;v.style.display='block';text.style.display='none';const t=Number(d.time)||0;const go=()=>{if(t>=0&&v.duration&&t<v.duration)v.currentTime=t;if(d.playing===true||d.action==='play')v.play().catch(()=>{})};if(v.readyState>=1)go();else v.addEventListener('loadedmetadata',go,{once:true})}catch(e){setMessage(d.video.name||d.pad?.name||'ShowCue','Unable to load video')}}else await showVideo(d);}else if(d.action!=='pause'&&d.action!=='stop')setMessage(d.song?.name||d.pad?.name||'ShowCue','Ready for performance');
  if(d.action==='pause')v.pause();
  if(d.action==='stop'){v.pause();try{v.currentTime=0}catch(e){}}
  if(typeof d.time==='number'&&v.readyState>=1&&Math.abs(v.currentTime-d.time)>.15){try{v.currentTime=d.time}catch(e){}}
}
window.addEventListener('message',e=>handle(e.data));
if(displayChannel)displayChannel.onmessage=e=>handle(e.data);
window.opener?.postMessage({source:'showcue-display',ready:true},'*');
try{if(displayChannel)displayChannel.postMessage({source:'showcue-display',ready:true})}catch(e){}
// Initial open is carried in the URL as well as postMessage. This makes iPad/iPhone popup/new-tab behaviour reliable.
const q=new URLSearchParams(location.search);
const initialFileKey=q.get('fileKey');
const initialBlobUrl=q.get('blobUrl');
if(initialBlobUrl||initialFileKey){handle({source:'showcue',action:q.get('action')||'open',video:initialBlobUrl?{blobUrl:initialBlobUrl,name:q.get('videoName')||''}:{fileKey:initialFileKey,name:q.get('videoName')||''},song:{name:q.get('songName')||''},pad:{name:q.get('padName')||''},time:Number(q.get('time')||0),playing:q.get('playing')==='1'})}
setInterval(()=>{if(!v.paused)window.opener?.postMessage({source:'showcue-display',time:v.currentTime},'*')},500);
</script></body></html>
