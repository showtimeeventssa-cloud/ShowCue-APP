<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShowCue TV Display</title><style>html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;overflow:hidden}body{display:grid;place-items:center}.wrap{width:100%;height:100%;display:grid;place-items:center}.video{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;display:none}.text{text-align:center;padding:5vw}.title{font-size:clamp(36px,7vw,96px);font-weight:800}.sub{font-size:clamp(18px,3vw,42px);margin-top:16px;color:#d5dce2}.badge{position:fixed;top:14px;left:14px;color:#8d9aa5;font-size:12px;opacity:.65}</style></head><body><div class="badge">SHOWCUE TV DISPLAY</div><div class="wrap"><video id="v" class="video" playsinline></video><div class="text" id="text"><div class="title">ShowCue</div><div class="sub">Ready for performance</div></div></div><script>const DB='ShowCueMediaDB',STORE='files';let db;const v=document.getElementById('v'),text=document.getElementById('text');function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function getFile(k){if(!k)return null;if(!db)db=await openDB();return new Promise((res,rej)=>{const q=db.transaction(STORE).objectStore(STORE).get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})}let url=null;window.addEventListener('message',async e=>{const d=e.data;if(!d||d.source!=='showcue')return;if(d.video&&d.video.fileKey){const f=await getFile(d.video.fileKey);if(f){if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);v.src=url;v.style.display='block';text.style.display='none';v.currentTime=d.time||0;if(d.action==='play'||d.action==='cue')v.play().catch(()=>{})}}else{text.style.display='block';v.style.display='none';text.innerHTML='<div class="title">'+(d.song?.name||d.pad?.name||'ShowCue')+'</div><div class="sub">Ready for performance</div>'}if(d.action==='pause')v.pause();if(d.action==='stop'){{v.pause();v.currentTime=0}}if(typeof d.time==='number'&&Math.abs(v.currentTime-d.time)>.15)v.currentTime=d.time});setInterval(()=>{if(!v.paused)window.opener?.postMessage({source:'showcue-display',time:v.currentTime},'*')},500)</script></body></html>
